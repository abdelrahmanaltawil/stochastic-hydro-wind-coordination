# Reproducible illustrative case; profiles are synthetic, not measured tariffs or weather.
# Two-operator coordination study (revenue-sharing contract + price decomposition).
# Water operator: SNET network (one pump, one elevated tank). Energy operator: the
# two-bus feeder of master.dss with its 1000 kW nominal load scaled to a 100 kW peak,
# a 200 kWp PV array, a 200 kWh/50 kW battery, and a connection rated 150 kW import /
# 50 kW export. Prices are time-of-use purchase prices and a flat sale price.
# The `coordination` section sets the flat retail tariff of the baseline, the
# contract shares reported, the price-coordination master and iteration budget,
# and the connection-limit sweeps. The previous single-operator study is
# recovered with load_scale: 1.0, capacity_kw: 100, grid_export_tariff: 0.0 and
# no explicit connection limits.
run_water: true
run_energy: true
run_nexus: true
T: 24
paths:
  output_dir: data/results/paper_runs
water:
  network: ./data/inputs/system_config/water/SNET.inp
  min_pressure_m: 20.0
  terminal_tank_closure: true
  n_pipe_segments: 12
energy:
  network: ./data/inputs/system_config/energy/master.dss
  base_power: 1000.0
  voltage_tolerance: 0.1
  n_current_segments: 5
  technologies:
    pv:
      capacity_kw: 200.0
      irradiance_profile:
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0.05
      - 0.2
      - 0.4
      - 0.6
      - 0.8
      - 0.95
      - 1
      - 0.95
      - 0.8
      - 0.6
      - 0.4
      - 0.2
      - 0.05
      - 0
      - 0
      - 0
      - 0
      - 0
      bus: loadbus
    storage:
      capacity_kwh: 200.0
      charge_efficiency: 0.95
      discharge_efficiency: 0.95
      max_charge_kw: 50.0
      max_discharge_kw: 50.0
      initial_soc_fraction: 0.5
      bus: loadbus
  cost:
    grid_import_tariff:
    - 0.08
    - 0.08
    - 0.08
    - 0.08
    - 0.08
    - 0.08
    - 0.08
    - 0.16
    - 0.16
    - 0.16
    - 0.16
    - 0.16
    - 0.16
    - 0.16
    - 0.16
    - 0.16
    - 0.32
    - 0.32
    - 0.32
    - 0.32
    - 0.32
    - 0.08
    - 0.08
    - 0.08
    grid_export_tariff: 0.03
  load_scale: 0.1
  max_grid_import_kw: 150.0
  max_grid_export_kw: 50.0
nexus:
  pump_efficiency: 0.75
  pump_bus:
    PU1: loadbus
solver:
  name: highs
  timeout: 600
  verbose: false
simulation:
  mode: daily
metrics:
  min_pressure_threshold: 20.0
  voltage_tolerance: 0.1
logging:
  level: INFO
coordination:
  flat_tariff: 0.16
  shares:
  - 0.0
  - 0.5
  - 1.0
  master: bundle
  max_iterations: 30
  subgradient_iterations: 15
  tolerance: 0.0001
  price_resolution: 0.0001
  proximal_step: 0.0005
  subproblem_rel_gap: 0.001
  import_limit_sweep_kw:
  - 150
  - 125
  - 100
  - 90
  - 80
  - 70
  - 60
  export_limit_sweep_kw:
  - 50
  - 25
  - 0
  subproblem_timeout_s: 180
